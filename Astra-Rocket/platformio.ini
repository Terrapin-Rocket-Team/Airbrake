; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps = 
    https://github.com/Terrapin-Rocket-Team/Astra-Rocket.git#dev
	https://github.com/odriverobotics/ODriveArduino.git
build_flags=
    -D ENV_TEENSY

[env:native]
platform = native
lib_deps =
    https://github.com/Terrapin-Rocket-Team/Astra-Rocket.git#dev
	https://github.com/odriverobotics/ODriveArduino.git
	throwtheswitch/Unity@^2.6.0
	https://github.com/DrewBrandt/NativeTestMocks.git
lib_ignore = SdFat
lib_compat_mode = off
test_build_src = yes
build_flags =
	-Wno-unknown-pragmas
	-std=c++17
	-DARDUINO=100 ; adafruit library needs it in order to compile
	-DNATIVE=1
	-DNATIVE_NO_STDOUT_DATA=1 ; dont print telem messages
	-DNOLOGI=1 ; don't print info logs on native
	-DUNITY_INCLUDE_DOUBLE
	-lws2_32
	-fpermissive
test_framework = unity
lib_ldf_mode = chain+
debug_build_flags = -g -O0 -fstack-protector-all